<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racha dos Ruins — Estatísticas</title>
<meta name="description" content="Placar geral do Racha dos Ruins: artilharia, títulos e histórico completo dos torneios.">
<meta name="theme-color" content="#071410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
:root{--night:#071410;--turf:#0d2019;--turf-2:#10271e;--line:#24463a;--chalk:#eaf2ec;--muted:#7b9488;--lamp:#ffc531;--paint:#8fd6b4;--flag:#ff5a3c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--night);color:var(--chalk);font:400 16px/1.45 "Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}.wrap,.board-inner{max-width:900px;margin:0 auto;padding-inline:20px}.wrap{padding-bottom:72px}.hidden{display:none!important}
.board{position:relative;overflow:hidden;margin-bottom:8px;background:var(--turf);border-bottom:2px solid var(--line)}.board::before{content:"";position:absolute;left:50%;top:-240px;width:480px;height:480px;transform:translateX(-50%);border:2px solid var(--line);border-radius:50%;opacity:.55;pointer-events:none}.board::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 26px);opacity:.8}.board-inner{position:relative;padding-top:34px;padding-bottom:26px}.eyebrow{margin:0 0 4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}h1{margin:0;font:400 clamp(38px,11vw,62px)/.92 Anton,"Arial Narrow",sans-serif;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.totals{display:grid;grid-template-columns:repeat(5,1fr);margin-top:26px;border-top:1px solid var(--line)}.totals>div{padding:14px 10px 4px;border-left:1px solid var(--line)}.totals>div:first-child{padding-left:0;border-left:0}.totals .n{display:block;color:var(--lamp);font:400 clamp(26px,7vw,40px)/1 Anton,"Arial Narrow",sans-serif;text-shadow:0 0 22px rgba(255,197,49,.28)}.totals .l{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.updated{margin:18px 0 0;color:var(--muted);font-size:13.5px}
h2{margin:44px 0 0;padding-bottom:8px;border-bottom:2px solid var(--line);font:400 20px/1.2 Anton,"Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase}.section-note{float:right;margin-top:4px;color:var(--muted);font:500 12px/1.4 "Barlow Semi Condensed",sans-serif;letter-spacing:.06em;text-transform:none}
table{width:100%;border-collapse:collapse}.rank tr{border-bottom:1px solid rgba(36,70,58,.5)}.rank tr:last-child{border-bottom:0}.rank tr:hover{background:rgba(36,70,58,.22)}.rank td{padding:9px 0;vertical-align:middle}.pos{width:38px;padding-right:12px!important;color:var(--muted);font-size:13px;font-weight:600;text-align:right}.who{max-width:1px;width:34%;overflow:hidden;font-size:16.5px;font-weight:500;text-overflow:ellipsis;white-space:nowrap}.barcell{width:46%;padding:9px 14px!important}.bar{height:8px;min-width:3px;border-radius:0 4px 4px 0}.val{width:74px;color:var(--chalk);font:400 19px Anton,"Arial Narrow",sans-serif;text-align:right;white-space:nowrap}.val small{color:var(--muted);font:600 12px "Barlow Semi Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase}.player-link{max-width:100%;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:inherit;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;cursor:pointer}.player-link:hover{color:var(--lamp);text-decoration-color:currentColor}
.tourneys{margin-top:4px}.tourney{border-bottom:1px solid rgba(36,70,58,.65)}.tourney summary{display:grid;grid-template-columns:92px minmax(180px,1fr) auto 22px;align-items:center;gap:12px;min-height:68px;padding:8px 0;cursor:pointer;list-style:none}.tourney summary::-webkit-details-marker{display:none}.tourney summary:hover{background:rgba(36,70,58,.16)}.date{color:var(--muted);font-size:14px}.champ{display:flex;min-width:0;align-items:center;gap:8px;font:400 18px/1.1 Anton,"Arial Narrow",sans-serif;letter-spacing:.02em;text-transform:uppercase}.champ-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{color:var(--lamp);font:700 11px "Barlow Semi Condensed",sans-serif;letter-spacing:.16em}.dot{width:9px;height:9px;flex:none}.meta{color:var(--muted);font-size:13.5px;text-align:right}.chevron{color:var(--muted);font-size:18px;transition:transform .18s ease}.tourney[open] .chevron{transform:rotate(180deg)}.nochamp{color:var(--muted);font-size:16px}
.tourney-body{margin:0 0 20px;padding:18px 18px 20px;background:var(--turf);border-left:2px solid var(--line)}.tourney-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.tourney-stat{padding:11px 14px;border-left:1px solid var(--line)}.tourney-stat:first-child{padding-left:0;border-left:0}.tourney-stat strong{display:block;color:var(--lamp);font:400 23px/1 Anton,sans-serif}.tourney-stat span{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}.subhead{margin:26px 0 9px;color:var(--paint);font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase}.subhead:first-of-type{margin-top:0}
.table-scroll{overflow-x:auto}.standing{min-width:520px}.standing th,.standing td{padding:7px 8px;border-bottom:1px solid rgba(36,70,58,.45);font-size:13px;text-align:center}.standing th{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.standing th:nth-child(2),.standing td:nth-child(2){text-align:left}.standing .team-cell{font-size:14px;font-weight:600}.standing .pts{color:var(--lamp);font-weight:700}
.phase+.phase{margin-top:24px}.phase-title{display:flex;align-items:center;gap:10px;margin:0 0 7px;color:var(--chalk);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.phase-title::after{content:"";height:1px;flex:1;background:var(--line)}.match{display:grid;grid-template-columns:82px minmax(100px,1fr) 70px minmax(100px,1fr) 94px;align-items:center;gap:9px;min-height:48px;border-bottom:1px solid rgba(36,70,58,.42)}.match-info{color:var(--muted);font-size:12px}.team-home{text-align:right}.team-away{text-align:left}.team-home,.team-away{overflow:hidden;font-size:14.5px;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.score{color:var(--chalk);font:400 20px/1 Anton,sans-serif;text-align:center}.match-status{justify-self:end;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.match-status.live{color:var(--flag)}.match-status.done{color:var(--paint)}.match-extra{grid-column:2/5;margin:-1px 0 9px;color:var(--muted);font-size:12.5px;text-align:center}.match-extra b{color:var(--chalk);font-weight:600}.penalty{color:var(--lamp)}
.squads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px}.squad{padding:9px 0;border-top:1px solid rgba(36,70,58,.45)}.squad-title{display:flex;align-items:center;gap:8px;font-weight:700}.squad p{margin:4px 0 0;color:var(--muted);font-size:13px}
.player-dialog{width:min(720px,calc(100% - 28px));max-height:min(86vh,820px);padding:0;border:1px solid var(--line);background:var(--turf);color:var(--chalk);box-shadow:0 28px 90px rgba(0,0,0,.65)}.player-dialog::backdrop{background:rgba(2,8,5,.82);backdrop-filter:blur(3px)}.profile{padding:28px}.profile-head{display:flex;align-items:start;justify-content:space-between;gap:20px;padding-bottom:18px;border-bottom:2px solid var(--line)}.profile-head .eyebrow{color:var(--paint)}.profile-title{margin:0;padding:0;border:0;font-size:34px;line-height:1}.dialog-close{width:38px;height:38px;flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-size:22px;line-height:1}.dialog-close:hover{border-color:var(--lamp);color:var(--lamp)}.profile-stats{display:grid;grid-template-columns:repeat(4,1fr);margin:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.profile-stat{padding:13px;border-left:1px solid var(--line)}.profile-stat:first-child{padding-left:0;border-left:0}.profile-stat strong{display:block;color:var(--lamp);font:400 28px/1 Anton,sans-serif}.profile-stat span{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}.rank-positions{display:flex;gap:20px;color:var(--muted);font-size:14px}.rank-positions strong{color:var(--chalk)}.profile-list{border-top:1px solid var(--line)}.profile-row{display:grid;grid-template-columns:92px minmax(120px,1fr) auto;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid rgba(36,70,58,.5)}.profile-row time,.profile-row small{color:var(--muted);font-size:13px}.profile-team{overflow:hidden;font-weight:600;text-overflow:ellipsis;white-space:nowrap}.profile-numbers{text-align:right}.profile-numbers strong{color:var(--lamp)}.profile-badge{margin-left:7px;color:var(--paint);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.scored-match{padding:10px 0;border-bottom:1px solid rgba(36,70,58,.5)}.scored-match-main{display:flex;justify-content:space-between;gap:16px;font-weight:600}.scored-match-meta{margin-top:3px;color:var(--muted);font-size:13px}.scored-match-goals{color:var(--lamp);white-space:nowrap}.profile-empty{padding:14px 0;color:var(--muted)}
.msg{margin-top:28px;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:15.5px}.msg.err{border-color:var(--flag);color:var(--chalk)}.msg strong{color:var(--flag)}.msg code{display:block;margin-top:8px;color:var(--muted);font:12.5px ui-monospace,"SFMono-Regular",Menlo,monospace;word-break:break-word}.retry{margin-top:14px;padding:7px 12px;border:1px solid var(--flag);background:transparent;color:var(--chalk);cursor:pointer}footer{margin-top:52px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.live-banner{display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 16px;background:rgba(255,90,60,.1);border:1px solid var(--flag);font-size:14px}.live-banner .live-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--flag);animation:live-pulse 1.6s infinite}.live-banner a{margin-left:auto;color:var(--chalk);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap;background:none;border:0;font:inherit}.live-banner a:hover{color:var(--lamp)}
@keyframes live-pulse{0%{box-shadow:0 0 0 0 rgba(255,90,60,.55)}70%{box-shadow:0 0 0 9px rgba(255,90,60,0)}100%{box-shadow:0 0 0 0 rgba(255,90,60,0)}}
.records{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px;background:var(--line)}.record-card{flex:1 1 200px;display:flex;flex-direction:column;gap:3px;padding:13px 14px;background:var(--turf);transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease}.record-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4);background:var(--turf-2)}.record-icon{font-size:18px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.record-card strong{font:400 21px/1.1 Anton,"Arial Narrow",sans-serif;color:var(--lamp)}.record-label{color:var(--paint);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.record-detail{color:var(--muted);font-size:12px}
.champion-card{position:relative;overflow:hidden;background:var(--turf);border-left:4px solid var(--lamp);box-shadow:0 14px 32px rgba(0,0,0,.32)}.champion-card::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border:2px solid rgba(255,197,49,.12);border-radius:50%;pointer-events:none}.champion-head{position:relative;display:flex;align-items:center;gap:10px;padding:18px 18px 0}.champion-trophy{font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}.champion-head strong{font:400 26px Anton,"Arial Narrow",sans-serif;text-transform:uppercase;text-shadow:0 0 18px rgba(255,197,49,.18)}.champion-tag{margin-left:auto;padding:4px 9px;background:rgba(255,197,49,.12);color:var(--lamp);font:700 11px "Barlow Semi Condensed",sans-serif;letter-spacing:.14em}.champion-stats{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:16px 18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.champion-stats div{padding:10px 4px;border-left:1px solid var(--line);text-align:center}.champion-stats div:first-child{border-left:0}.champion-stats strong{display:block;color:var(--lamp);font:400 22px Anton,"Arial Narrow",sans-serif}.champion-stats span{display:block;margin-top:3px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.1em}.champion-meta{position:relative;margin:12px 18px 0;color:var(--muted);font-size:12.5px}.champion-roster{position:relative;margin:5px 18px 18px;color:var(--chalk);font-size:13.5px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:10px;margin:6px 0 18px}.podium-slot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;background:var(--turf);border-top:3px solid var(--line);text-align:center;transition:transform .15s ease,box-shadow .15s ease}.podium-slot:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,0,0,.4)}.podium-slot .player-link{color:inherit;text-decoration:none;font-weight:600}.podium-slot .player-link:hover{color:var(--lamp)}.podium-medal{font-size:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.podium-slot strong{font:400 30px Anton,"Arial Narrow",sans-serif;color:var(--lamp)}.podium-unit{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.place-1{order:2;border-color:var(--lamp);padding-top:22px;box-shadow:0 8px 22px rgba(0,0,0,.3)}.place-2{order:1}.place-3{order:3}
.tourneys.timeline{position:relative;padding-left:24px}.tourneys.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}.tourneys.timeline .tourney{position:relative}.tourneys.timeline .tourney::before{content:"";position:absolute;left:-20px;top:30px;width:10px;height:10px;border-radius:50%;background:var(--muted)}.tourneys.timeline .tourney.is-live::before{background:var(--flag);box-shadow:0 0 0 4px rgba(255,90,60,.18)}
.compare-selects{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;max-width:640px;margin-top:4px}.compare-selects label{display:grid;gap:4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.compare-selects select{width:100%;height:42px;padding:8px 10px;border:1px solid var(--line);background:var(--turf);color:var(--chalk);font:inherit}.compare-vs-label{padding-bottom:10px;color:var(--muted)}.compare-result{margin-top:18px}.compare-heads{display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 20px Anton,"Arial Narrow",sans-serif;text-transform:uppercase}.compare-vs{color:var(--muted)}.compare-table{width:100%;margin-top:10px;border-collapse:collapse}.compare-table td{padding:9px 0;border-bottom:1px solid rgba(36,70,58,.5);font-size:15px}.cmp-val{width:80px;color:var(--lamp);font:400 20px Anton,"Arial Narrow",sans-serif}.cmp-val.cmp-a{text-align:left}.cmp-val.cmp-b{text-align:right}.cmp-label{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:center}.compare-h2h{margin-top:14px;color:var(--muted);font-size:14px}
.share-btn{margin-top:18px;padding:10px 16px;border:1px solid var(--lamp);background:transparent;color:var(--lamp);font-weight:700;cursor:pointer}.share-btn:hover{background:var(--lamp);color:var(--night)}.share-btn:disabled{opacity:.6;cursor:wait}
@media(max-width:650px){.tourney summary{grid-template-columns:82px 1fr 20px}.tourney summary .meta{grid-column:2}.chevron{grid-column:3;grid-row:1/3}.match{grid-template-columns:1fr 58px 1fr;gap:6px}.match-info{grid-column:1/4;padding-top:8px}.team-home{grid-column:1}.score{grid-column:2}.team-away{grid-column:3}.match-status{grid-column:1/4;justify-self:center;margin-bottom:7px}.match-extra{grid-column:1/4}.squads{grid-template-columns:1fr}.profile{padding:20px}.profile-stats{grid-template-columns:1fr 1fr}.profile-stat:nth-child(3){padding-left:0;border-left:0;border-top:1px solid var(--line)}.profile-stat:nth-child(4){border-top:1px solid var(--line)}.profile-row{grid-template-columns:80px 1fr}.profile-numbers{grid-column:2;text-align:left}.rank-positions{flex-direction:column;gap:4px}.compare-selects{grid-template-columns:1fr}.compare-vs-label{display:none}.podium-slot strong{font-size:24px}}
@media(max-width:460px){.totals{grid-template-columns:repeat(2,1fr)}.totals>div:nth-child(2n+1):nth-child(n+3){padding-left:0;border-left:0}.totals>div:nth-child(n+3){margin-top:10px;border-top:1px solid var(--line)}.who{width:40%}.barcell{width:30%}.section-note{display:none}.tourney-body{padding-inline:12px}.tourney-stats{grid-template-columns:1fr 1fr 1fr}.tourney-stat{padding-inline:8px}.record-card{flex-basis:44%}.podium-slot{padding:12px 6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="board"><div class="board-inner"><p class="eyebrow">Placar geral</p><h1>Racha dos Ruins</h1><div class="totals" id="totals"></div><p class="updated" id="updated" aria-live="polite">Carregando…</p></div></header>
<div class="wrap">
  <div id="loading" class="msg" role="status">Buscando dados…</div>
  <div id="error" class="msg err hidden" role="alert"></div>
  <main id="content" class="hidden">
    <div id="live-banner" class="live-banner hidden" role="status"></div>
    <h2>Recordes</h2><div id="records" class="records"></div>
    <h2>Campeão da semana</h2><div id="champion-card" class="champion-card"></div>
    <h2>Artilharia</h2><div id="scorers"></div>
    <h2>Títulos</h2><div id="titles"></div>
    <h2>Comparar jogadores</h2>
    <div class="compare-selects">
      <label>Jogador A<select id="compare-a"></select></label>
      <span class="compare-vs-label">×</span>
      <label>Jogador B<select id="compare-b"></select></label>
    </div>
    <div id="compare-result" class="compare-result"></div>
    <h2>Torneios <span class="section-note">Toque em um torneio para ver jogo a jogo</span></h2><div id="tourneys" class="tourneys timeline"></div>
  </main>
  <footer>Dados sincronizados pelo app Racha dos Ruins</footer>
</div>
<dialog id="player-dialog" class="player-dialog" aria-labelledby="player-profile-name">
  <div id="player-profile" class="profile"></div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
